<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Graph visualizer mid-run: Dijkstra's algorithm relaxing an edge from a processed node, with visited nodes in green and the active node highlighted">
  <rect width="900" height="620" fill="#fbf4ee"/>

  <text x="40" y="52" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#362a26">Graph Algorithms</text>
  <text x="40" y="78" font-family="system-ui, sans-serif" font-size="14" fill="#725f57">Build your own weighted graph, then watch the algorithm run on it.</text>

  <g transform="translate(590,32)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">
    <rect width="270" height="38" rx="10" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
    <text x="18" y="24" fill="#362a26">Dijkstra's Shortest Path ▾</text>
  </g>

  <!-- canvas -->
  <rect x="40" y="110" width="820" height="320" rx="18" fill="#f5e8de"/>

  <!-- edges -->
  <g stroke="rgba(54,42,38,0.28)" stroke-width="2">
    <line x1="160" y1="255" x2="320" y2="185"/>
    <line x1="160" y1="255" x2="320" y2="335"/>
    <line x1="320" y1="185" x2="320" y2="335"/>
    <line x1="320" y1="185" x2="500" y2="260"/>
    <line x1="320" y1="335" x2="500" y2="260"/>
    <line x1="320" y1="335" x2="700" y2="335"/>
    <line x1="500" y1="260" x2="680" y2="185"/>
    <line x1="680" y1="185" x2="700" y2="335"/>
  </g>
  <line x1="500" y1="260" x2="700" y2="335" stroke="#4f7d72" stroke-width="3.5"/>

  <!-- edge weight badges -->
  <g font-family="ui-monospace, monospace" font-size="12" fill="#362a26">
    <rect x="228" y="207" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="240" y="221" text-anchor="middle">4</text>
    <rect x="228" y="283" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="240" y="297" text-anchor="middle">2</text>
    <rect x="308" y="250" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="320" y="264" text-anchor="middle">1</text>
    <rect x="398" y="212" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="410" y="226" text-anchor="middle">5</text>
    <rect x="398" y="288" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="410" y="302" text-anchor="middle">8</text>
    <rect x="498" y="325" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="510" y="339" text-anchor="middle">10</text>
    <rect x="578" y="212" width="24" height="20" rx="6" fill="#fffbf8" stroke="#ecdcd3"/><text x="590" y="226" text-anchor="middle">6</text>
    <rect x="588" y="288" width="24" height="20" rx="6" fill="#e8f4f0" stroke="#4f7d72"/><text x="600" y="302" text-anchor="middle" fill="#2f5148">3</text>
  </g>

  <!-- nodes: A B C visited(green), D active(rose), E F default -->
  <g font-family="ui-monospace, monospace" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="160" cy="255" r="24" fill="#437a52" stroke="#c9b2a4"/><text x="160" y="260" fill="#fffbf8">A</text>
    <circle cx="320" cy="185" r="24" fill="#437a52" stroke="#c9b2a4"/><text x="320" y="190" fill="#fffbf8">B</text>
    <circle cx="320" cy="335" r="24" fill="#437a52" stroke="#c9b2a4"/><text x="320" y="340" fill="#fffbf8">C</text>
    <circle cx="500" cy="260" r="27" fill="none" stroke="#b04f6f" stroke-width="2" opacity="0.45"/>
    <circle cx="500" cy="260" r="24" fill="#b04f6f" stroke="#c9b2a4"/><text x="500" y="265" fill="#fffbf8">D</text>
    <circle cx="680" cy="185" r="24" fill="#fffbf8" stroke="#c9b2a4"/><text x="680" y="190" fill="#362a26">E</text>
    <circle cx="700" cy="335" r="24" fill="#fffbf8" stroke="#c9b2a4"/><text x="700" y="340" fill="#362a26">F</text>
  </g>

  <!-- message strip -->
  <rect x="40" y="448" width="820" height="46" rx="12" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
  <text x="58" y="476" font-family="ui-monospace, monospace" font-size="13" fill="#4f7d72">Relax edge D→F: 8 + 3 = 11 &lt; ∞, update.</text>

  <!-- distances panel -->
  <text x="40" y="524" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#362a26">Shortest distances</text>
  <g font-family="ui-monospace, monospace" font-size="13" text-anchor="middle">
    <g transform="translate(40,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">A</text><text x="60" y="42" font-weight="700" fill="#362a26">0</text>
    </g>
    <g transform="translate(172,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">B</text><text x="60" y="42" font-weight="700" fill="#362a26">3</text>
    </g>
    <g transform="translate(304,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">C</text><text x="60" y="42" font-weight="700" fill="#362a26">2</text>
    </g>
    <g transform="translate(436,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">D</text><text x="60" y="42" font-weight="700" fill="#362a26">8</text>
    </g>
    <g transform="translate(568,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">E</text><text x="60" y="42" font-weight="700" fill="#362a26">&#8734;</text>
    </g>
    <g transform="translate(700,540)">
      <rect width="120" height="52" rx="10" fill="#f9ede6" stroke="#ecdcd3"/>
      <text x="60" y="22" fill="#725f57">F</text><text x="60" y="42" font-weight="700" fill="#362a26">11</text>
    </g>
  </g>
</svg>
