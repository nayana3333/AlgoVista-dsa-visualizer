<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sorting visualizer mid-run: Quick Sort partitioning an array, with sorted, comparing, pivot, and unsorted bars color-coded">
  <rect width="900" height="560" fill="#fbf4ee"/>

  <!-- page header -->
  <text x="40" y="52" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#362a26">Sorting Algorithms</text>
  <text x="40" y="78" font-family="system-ui, sans-serif" font-size="14" fill="#725f57">Step through five classic sorting algorithms bar by bar.</text>

  <!-- algo select chip -->
  <g transform="translate(650,32)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">
    <rect width="210" height="38" rx="10" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
    <text x="18" y="24" fill="#362a26">Quick Sort ▾</text>
  </g>

  <!-- chart panel -->
  <rect x="40" y="110" width="820" height="300" rx="18" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>

  <!-- bars: baseline y=380, area x 70..830 -->
  <g>
    <rect x="70"  y="200" width="24" height="180" rx="3" fill="#437a52"/>
    <rect x="102" y="230" width="24" height="150" rx="3" fill="#437a52"/>
    <rect x="134" y="170" width="24" height="210" rx="3" fill="#437a52"/>
    <rect x="166" y="290" width="24" height="90"  rx="3" fill="#dfcabb"/>
    <rect x="198" y="150" width="24" height="230" rx="3" fill="#946820"/>
    <rect x="230" y="260" width="24" height="120" rx="3" fill="#4f7d72"/>
    <rect x="262" y="330" width="24" height="50"  rx="3" fill="#dfcabb"/>
    <rect x="294" y="190" width="24" height="190" rx="3" fill="#4f7d72"/>
    <rect x="326" y="310" width="24" height="70"  rx="3" fill="#dfcabb"/>
    <rect x="358" y="220" width="24" height="160" rx="3" fill="#b25a35"/>
    <rect x="390" y="270" width="24" height="110" rx="3" fill="#dfcabb"/>
    <rect x="422" y="160" width="24" height="220" rx="3" fill="#dfcabb"/>
    <rect x="454" y="300" width="24" height="80"  rx="3" fill="#dfcabb"/>
    <rect x="486" y="240" width="24" height="140" rx="3" fill="#dfcabb"/>
    <rect x="518" y="180" width="24" height="200" rx="3" fill="#dfcabb"/>
    <rect x="550" y="320" width="24" height="60"  rx="3" fill="#dfcabb"/>
    <rect x="582" y="250" width="24" height="130" rx="3" fill="#dfcabb"/>
    <rect x="614" y="340" width="24" height="40"  rx="3" fill="#dfcabb"/>
    <rect x="646" y="210" width="24" height="170" rx="3" fill="#dfcabb"/>
    <rect x="678" y="280" width="24" height="100" rx="3" fill="#dfcabb"/>
    <rect x="710" y="350" width="24" height="30"  rx="3" fill="#dfcabb"/>
    <rect x="742" y="200" width="24" height="180" rx="3" fill="#dfcabb"/>
    <rect x="774" y="360" width="24" height="20"  rx="3" fill="#dfcabb"/>
    <rect x="806" y="230" width="24" height="150" rx="3" fill="#dfcabb"/>
  </g>

  <!-- playback controls -->
  <rect x="40" y="428" width="820" height="70" rx="16" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
  <g font-family="ui-monospace, monospace" font-size="14" font-weight="700">
    <circle cx="80" cy="463" r="18" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
    <text x="80" y="468" text-anchor="middle" fill="#362a26">&#8635;</text>
    <circle cx="130" cy="463" r="18" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
    <text x="130" y="468" text-anchor="middle" fill="#362a26">&#9664;</text>
    <rect x="164" y="445" width="100" height="36" rx="18" fill="#b04f6f"/>
    <text x="214" y="468" text-anchor="middle" fill="#fffbf8">&#9654; Play</text>
    <circle cx="300" cy="463" r="18" fill="#fffbf8" stroke="#ecdcd3" stroke-width="1.5"/>
    <text x="300" y="468" text-anchor="middle" fill="#362a26">&#9654;|</text>
  </g>
  <text x="790" y="468" text-anchor="end" font-family="ui-monospace, monospace" font-size="13" fill="#725f57">step 214 / 480</text>

  <!-- legend -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#725f57">
    <rect x="40" y="520" width="12" height="12" rx="2" fill="#dfcabb"/><text x="58" y="530">Unsorted</text>
    <rect x="150" y="520" width="12" height="12" rx="2" fill="#4f7d72"/><text x="168" y="530">Comparing</text>
    <rect x="270" y="520" width="12" height="12" rx="2" fill="#b25a35"/><text x="288" y="530">Swapping</text>
    <rect x="385" y="520" width="12" height="12" rx="2" fill="#946820"/><text x="403" y="530">Pivot</text>
    <rect x="470" y="520" width="12" height="12" rx="2" fill="#437a52"/><text x="488" y="530">Sorted</text>
  </g>
</svg>
