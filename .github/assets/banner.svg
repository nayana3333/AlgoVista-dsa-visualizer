<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AlgoVista — an interactive algorithm visualizer">
  <rect width="1200" height="320" fill="#fbf4ee"/>
  <line x1="0" y1="319" x2="1200" y2="319" stroke="#ecdcd3" stroke-width="2"/>

  <!-- decorative sorting-bar motif, right side -->
  <g transform="translate(830,60)">
    <rect x="0"   y="150" width="26" height="70"  rx="4" fill="#dfcabb"/>
    <rect x="34"  y="110" width="26" height="110" rx="4" fill="#4f7d72"/>
    <rect x="68"  y="60"  width="26" height="160" rx="4" fill="#b04f6f"/>
    <rect x="102" y="130" width="26" height="90"  rx="4" fill="#dfcabb"/>
    <rect x="136" y="20"  width="26" height="200" rx="4" fill="#437a52"/>
    <rect x="170" y="90"  width="26" height="130" rx="4" fill="#dfcabb"/>
    <rect x="204" y="150" width="26" height="70"  rx="4" fill="#437a52"/>
    <rect x="238" y="40"  width="26" height="180" rx="4" fill="#dfcabb"/>
    <rect x="272" y="170" width="26" height="50"  rx="4" fill="#437a52"/>
    <rect x="306" y="105" width="26" height="115" rx="4" fill="#946820"/>
  </g>

  <!-- graph motif, far right -->
  <g transform="translate(1010,55)" stroke="#c9b2a4" stroke-width="2" fill="none">
    <line x1="20" y1="25" x2="95" y2="15"/>
    <line x1="20" y1="25" x2="30" y2="95"/>
    <line x1="95" y1="15" x2="120" y2="80"/>
    <line x1="30" y1="95" x2="120" y2="80"/>
    <line x1="120" y1="80" x2="150" y2="150"/>
  </g>
  <g transform="translate(1010,55)">
    <circle cx="20" cy="25" r="9" fill="#437a52"/>
    <circle cx="95" cy="15" r="9" fill="#437a52"/>
    <circle cx="30" cy="95" r="9" fill="#fffbf8" stroke="#c9b2a4" stroke-width="2"/>
    <circle cx="120" cy="80" r="9" fill="#8b5d7a"/>
    <circle cx="150" cy="150" r="9" fill="#fffbf8" stroke="#c9b2a4" stroke-width="2"/>
  </g>

  <!-- wordmark -->
  <text x="70" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#362a26">Algo<tspan fill="#b04f6f">Vista</tspan></text>
  <text x="72" y="190" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" fill="#725f57">Watch algorithms think, step by step.</text>

  <!-- paradigm chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600">
    <g transform="translate(72,225)">
      <rect width="120" height="34" rx="17" fill="#f3d9e2"/>
      <circle cx="18" cy="17" r="5" fill="#b04f6f"/>
      <text x="32" y="22" fill="#8a3455">Sorting</text>
    </g>
    <g transform="translate(202,225)">
      <rect width="108" height="34" rx="17" fill="#dbe9e2"/>
      <circle cx="18" cy="17" r="5" fill="#4f7d72"/>
      <text x="32" y="22" fill="#2f5148">Graph</text>
    </g>
    <g transform="translate(320,225)">
      <rect width="180" height="34" rx="17" fill="#f2e2c8"/>
      <circle cx="18" cy="17" r="5" fill="#b25a35"/>
      <text x="32" y="22" fill="#7a3d20">0/1 Knapsack</text>
    </g>
    <g transform="translate(510,225)">
      <rect width="140" height="34" rx="17" fill="#ecdce6"/>
      <circle cx="18" cy="17" r="5" fill="#8b5d7a"/>
      <text x="32" y="22" fill="#5c3d4f">N-Queens</text>
    </g>
  </g>
</svg>
